baseURL = 'https://marinamoya.me/'
locale = 'en-us'
title = "Marina Moya"
theme = 'LoveIt'
avatarURL = "assets/images/avatar.png"

[menu]

  [[menu.main]]
    identifier = "por-que"
    name = "El Por Qué"
    url = "/por-que"
    weight = 1

  [[menu.main]]
    identifier = "el-como"
    name = "El Cómo"
    url = "/como"
    weight = 2
  
  [[menu.main]]
    identifier = "posts"
    name = "El Qué"
    url = "/posts/"
    weight = 3

  [[menu.main]]
    identifier = "Recursos"
    name = "Recursos"
    url = "/recursos"
    weight = 4

  [[menu.main]]
    identifier = "about"
    name = "Sobre Mi"
    url = "/sobre-mi"
    weight = 5

[params]
  # site default theme ["auto", "light", "dark"]
  defaultTheme = "auto"

  # date format
  # dateFormat = "02-01-2020"

  # website title for Open Graph and Twitter Cards
  title = "Marina Moya"

  # website description for RSS, SEO, Open Graph and Twitter Cards
  description = "Marina Moya Cool Site"

  # website images for Open Graph and Twitter Cards
  images = []

  # Author config
  [params.author]
    name = "Marina Moya"
    email = "hola@hola.com"
    link = ""
# Header config
  [params.header]
    # desktop header mode ["fixed", "normal", "auto"]
    desktopMode = "fixed"

    # mobile header mode ["fixed", "normal", "auto"]
    mobileMode = "auto"

    # Header title config
    [params.header.title]
      # URL of the LOGO
      logo = ""

      # title name
      name = "LaWebNoEsGratis."

      # you can add extra information before the name (HTML format is supported), such as icons
      pre = ""

      # you can add extra information after the name (HTML format is supported), such as icons
      post = ""

      # whether to use typeit animation for title name
      typeit = true

  # Footer config
  [params.footer]
    enable = true
    # Custom content (HTML format is supported)
    custom = "Por un mejor futuro"

    # whether to show Hugo and theme info
    hugo = true

    # whether to show copyright info
    copyright = true

    # whether to show the author
    author = true
    # site creation time
    since = 2026

# Search config
  [params.search]
    enable = true
    # type of search engine ["lunr", "algolia", "fuse", "pagefind"]
    type = "fuse"

    # max index length of the chunked content
    contentLength = 4000

    # placeholder of the search bar
    placeholder = "Busca aquí"

    # max number of results length
    maxResultLength = 10
    # snippet length of the result

    snippetLength = 30
    # HTML tag name of the highlight part in results
    highlightTag = "em"
    # whether to use the absolute URL based on the baseURL in search index
    absoluteURL = false
    
    [params.search.algolia]
      index = ""
      appID = ""
      searchKey = ""
    [params.search.fuse]
      # https://fusejs.io/api/options.html
      isCaseSensitive = false
      minMatchCharLength = 2
      findAllMatches = false
      location = 0
      threshold = 0.3
      distance = 100
      ignoreLocation = false
    [params.search.pagefind]
      # Pagefind base path (run "npx pagefind --site public" after hugo build)
      # Pagefind 基础路径 (在 hugo 构建后运行 "npx pagefind --site public")
      basePath = "/_pagefind/"

[params.home]
    # Home page profile
    [params.home.profile]
      enable = true
      # URL of avatar shown in home page
      avatarURL = "https://ca.slack-edge.com/TMFCF005N-U093R1YJVU3-0eadbfb30ab9-512"
      # {{< version 0.2.7 changed >}} title shown in home page (HTML format is supported)
      title = "Una guía para entender cómo funciona la web, el papel de las Grandes Tecnológicas y cómo desvincularnos"
      # subtitle shown in home page (HTML format is supported)
      subtitle = "Hay vida más allá de Google. Lo prometo. La he visto."
      # whether to use typeit animation for subtitle
      typeit = true
      # whether to show social links
      social = true
      # {{< version 0.2.0 >}} disclaimer (HTML format is supported)
      disclaimer = "¿Tienes alguna duda?¿No sabes por dónde empezar? Escríbeme."
    # Home page posts

    [params.home.posts]
      enable = true
      # special amount of posts in each home posts page
      paginate = 0
      # {{< version 0.2.0 deleted >}} replaced with hiddenFromHomePage in params.page
      # default behavior when you don't set "hiddenFromHomePage" in front matter
      defaultHiddenFromHomePage = false

  [params.social]
        Email = "contact@e.com"


